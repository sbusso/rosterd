<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rosterd</title>
<style>
  :root { color-scheme: dark; --bg: #0f0f10; --fg: #e4e4e7; --dim: #8b8b92; --line: #232326; --card: #17171a; --hover: #1c1c21;
    --active: #4caf50; --idle: #8899aa; --needs_attention: #ffb300; --unknown: #6b6b73; --off: #55555c; --err: #ef5350; --link: #8ab4f8 }
  * { box-sizing: border-box }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 -apple-system, system-ui, sans-serif }
  a { color: var(--link); text-decoration: none }
  header { position: sticky; top: 0; z-index: 1; background: var(--bg); padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap }
  header b { font-size: 15px } header .sum { color: var(--dim) } header .st { color: var(--dim); margin-left: auto; font-size: 12px }
  header .st.bad { color: var(--err) }
  main, section { padding: 0 16px }
  h2 { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; margin: 20px 0 6px; display: flex; gap: 10px; align-items: baseline }
  h2 small { text-transform: none; letter-spacing: 0; font-size: 12px }
  .list { border: 1px solid var(--line); border-radius: 8px; background: var(--card); overflow: hidden }
  .list > small { display: block; padding: 10px 12px; color: var(--dim) }
  .s { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line) }
  .s:first-child { border-top: 0 } .s:hover { background: var(--hover) }
  .s.ended, .s.suspended, .s.stale, .peer-unreachable .s { color: var(--dim) } .s.ended .name { text-decoration: line-through }
  .mark { grid-row: 1 / span 2; position: relative; width: 18px; height: 18px; align-self: center; font-weight: 700; font-size: 12px; line-height: 18px; text-align: center }
  .mark { color: var(--fg) } .mark.claude, .hz.claude { color: #d97757 } .s.ended .mark, .s.suspended .mark, .s.stale .mark { opacity: 0.5 }
  .mark svg { display: block; width: 18px; height: 18px; fill: currentColor }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor }
  .mark .dot { position: absolute; right: -3px; bottom: -3px; box-shadow: 0 0 0 2px var(--card) }
  .dot.unknown { background: none; box-shadow: inset 0 0 0 1.5px currentColor }
  .needs_attention { color: var(--needs_attention) } .active { color: var(--active) } .idle { color: var(--idle) } .unknown { color: var(--unknown) }
  .ended, .suspended, .stale { color: var(--off) }
  .who { display: flex; gap: 8px; align-items: baseline; min-width: 0; flex-wrap: wrap } .name { font-weight: 600; color: var(--fg) }
  .state { font-size: 12px; font-weight: 500 } .ev { color: var(--dim); font-size: 12px }
  .proj { font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: 4px; background: var(--line); color: var(--fg) }
  .meta { grid-column: 2; color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  .stats { grid-column: 3; display: flex; gap: 12px; justify-content: flex-end; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap }
  .hz svg { width: 14px; height: 14px; fill: currentColor; vertical-align: -3px }
  .stats svg { width: 12px; height: 12px; vertical-align: -2px; margin-right: 3px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round }
  .acts { grid-column: 3; grid-row: 2; display: flex; gap: 6px; align-items: center; justify-content: flex-end; flex-wrap: wrap }
  .pend { grid-column: 2 / -1; border-left: 2px solid var(--needs_attention); padding: 4px 10px; margin: 4px 0 2px; display: flex; gap: 6px 10px; align-items: center; flex-wrap: wrap }
  .pend b { font-weight: 600 } .pend small { color: var(--dim) }
  button { font: inherit; font-size: 12px; cursor: pointer; background: #232327; color: var(--fg); border: 1px solid #36363c; border-radius: 6px; padding: 4px 10px }
  button:hover { background: #2b2b31 } button.go { background: #2a3a20; border-color: #3f5a2f } button.no { color: var(--err) }
  input { font: inherit; font-size: 12px; background: #0d0d0f; color: var(--fg); border: 1px solid #333; border-radius: 6px; padding: 4px 8px }
  form.p { display: flex; gap: 6px } form.p input { width: 180px }
  @media (max-width: 720px) { .s { grid-template-columns: 8px minmax(0, 1fr) } .acts { grid-column: 2; grid-row: auto; justify-content: flex-start } .meta { white-space: normal } form.p input { width: 120px } }
  pre#log { white-space: pre-wrap; word-break: break-word; font: 12px/1.4 ui-monospace, monospace; padding: 10px 16px; margin: 0; min-height: 40vh }
  pre#log .tool { color: var(--link) } #recap { padding: 0 16px; color: var(--dim); white-space: pre-wrap }
  dialog { background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; max-width: 92vw }
  dialog form { display: flex; flex-direction: column; gap: 8px; min-width: 260px } dialog input { width: auto } .err { color: var(--err) }
  #qr form { max-width: 280px; align-items: stretch } #qrSvg { background: #fff; padding: 12px; border-radius: 6px; line-height: 0 }
  #qrSvg svg { width: 100%; height: auto } #qrLink { font: 11px/1.4 ui-monospace, monospace; word-break: break-all; display: block }
  #qr .row { display: flex; gap: 6px; justify-content: flex-end }
</style>
<header id="hdr"></header>
<section id="attention"></section>
<main id="roster"></main>
<pre id="log" hidden></pre>
<div id="recap" hidden></div>
<dialog id="qr"><form method="dialog"><div id="qrSvg"></div><a id="qrLink"></a><div class="row"><button type="button" id="qrCopy">copy link</button><button>close</button></div></form></dialog>
<dialog id="ws"><form method="dialog">
  <b>Workspace upstream</b>
  <input id="wsUrl" placeholder="https://ws.example.ts.net"><input id="wsTok" placeholder="token" type="password">
  <div style="display:flex;gap:6px;justify-content:flex-end"><button value="clear">clear</button><button value="save">save</button></div>
</form></dialog>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ago = (t) => { if (!t) return ''; const s = Math.max(0, (Date.now() - new Date(t)) / 1000); return s < 60 ? `${s | 0}s` : s < 3600 ? `${(s / 60) | 0}m` : s < 86400 ? `${(s / 3600) | 0}h` : `${(s / 86400) | 0}d`; };
const ms = (n) => ago(Date.now() - (n || 0));
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

// The loopback bearer, R6: taken from ?token= once, kept for the tab, never in the URL after.
const q = new URLSearchParams(location.search);
if (q.get('token')) { sessionStorage.setItem('rosterd.token', q.get('token')); q.delete('token'); history.replaceState(null, '', location.pathname + (q.size ? '?' + q : '')); }
const auth = () => { const t = sessionStorage.getItem('rosterd.token'); return t ? { authorization: `Bearer ${t}` } : {}; };
const api = async (path, body, method) => {
  const r = await fetch(path, { method: method || (body ? 'POST' : 'GET'), headers: { ...auth(), ...(body ? { 'content-type': 'application/json' } : {}) }, body: body && JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `${r.status}`);
  return j;
};
// EventSource cannot send a bearer, so SSE is a streamed fetch: `data:` lines between blank lines.
async function sse(path, onEvent, onStatus) {
  for (;;) {
    try {
      const r = await fetch(path, { headers: auth() });
      if (!r.ok) throw new Error(r.status === 401 ? 'unauthorized: open with ?token=' : `${r.status}`);
      onStatus('');
      const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '';
      for (;;) {
        const { value, done } = await rd.read(); if (done) break;
        buf += dec.decode(value, { stream: true }).replace(/\r\n/g, '\n');
        let i; while ((i = buf.indexOf('\n\n')) >= 0) {
          const data = buf.slice(0, i).split('\n').filter((l) => l.startsWith('data:')).map((l) => l.slice(5).trim()).join('\n');
          buf = buf.slice(i + 2);
          if (data) { try { onEvent(JSON.parse(data)); } catch (e) { console.warn(e); } }
        }
      }
      onStatus('disconnected');
    } catch (e) { onStatus(String(e.message || e)); }
    await new Promise((r) => setTimeout(r, 2000));
  }
}

const state = { swarm: null, local: '', pending: {}, seen: {}, drafts: {}, status: 'connecting', attention: [], decisions: {}, wsErr: '' };
const nodeOf = (key) => key.split(':')[0];
// Session actions reach the owning node through this node, R7.5: local keys directly, peers under /swarm/{node_id}/.
const spath = (key, suffix = '') => (nodeOf(key) === state.local ? `/sessions/${key}${suffix}` : `/swarm/${nodeOf(key)}/sessions/${key}${suffix}`);
const ws = () => { try { return JSON.parse(localStorage.getItem('rosterd.workspace') || 'null'); } catch { return null; } };

// ---------- roster page ----------
// One word for a row, liveness first: ended, suspended and stale say more than the last activity did.
const stateOf = (r) => (r.liveness === 'live' ? r.activity : r.liveness);
const RANK = { needs_attention: 0, active: 1, idle: 2, unknown: 3, suspended: 4, stale: 4, ended: 5 };
// The CLI's display name, R14.1: the name, else the cwd's last segment in brackets, else the pid.
const CPU = '<svg viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1"/><path d="M6 1v3M10 1v3M6 12v3M10 12v3M1 6h3M1 10h3M12 6h3M12 10h3"/></svg>';
const CLOCK = '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5"/><path d="M8 4.5V8l2.5 1.5"/></svg>';
const mem = (mb) => mb >= 1024 ? `${(mb / 1024).toFixed(1)} GB` : `${mb} MB`;
const statsHtml = (r) => `${r.load ? `<span>${CPU}${r.load.cpu_pct}%</span><span>${mem(r.load.rss_mb)}</span>` : ''}<span>${CLOCK}${ago(r.started_at)}</span>`;
const tilde = (p) => p.replace(/^(\/Users\/[^/]+|\/home\/[^/]+|\/root)(?=\/|$)/, '~');
const projOf = (r) => r.cwd ? r.cwd.replace(/\/+$/, '').split('/').pop() : '';
// The harness by its logo: Claude's, OpenAI's for codex, pi's; any other by name.
const LOGO = { claude: '<svg viewBox="0 0 24 24"><path d="m4.7144 15.9555 4.7174-2.6471.079-.2307-.079-.1275h-.2307l-.7893-.0486-2.6956-.0729-2.3375-.0971-2.2646-.1214-.5707-.1215-.5343-.7042.0546-.3522.4797-.3218.686.0608 1.5179.1032 2.2767.1578 1.6514.0972 2.4468.255h.3886l.0546-.1579-.1336-.0971-.1032-.0972L6.973 9.8356l-2.55-1.6879-1.3356-.9714-.7225-.4918-.3643-.4614-.1578-1.0078.6557-.7225.8803.0607.2246.0607.8925.686 1.9064 1.4754 2.4893 1.8336.3643.3035.1457-.1032.0182-.0728-.164-.2733-1.3539-2.4467-1.445-2.4893-.6435-1.032-.17-.6194c-.0607-.255-.1032-.4674-.1032-.7285L6.287.1335 6.6997 0l.9957.1336.419.3642.6192 1.4147 1.0018 2.2282 1.5543 3.0296.4553.8985.2429.8318.091.255h.1579v-.1457l.1275-1.706.2368-2.0947.2307-2.6957.0789-.7589.3764-.9107.7468-.4918.5828.2793.4797.686-.0668.4433-.2853 1.8517-.5586 2.9021-.3643 1.9429h.2125l.2429-.2429.9835-1.3053 1.6514-2.0643.7286-.8196.85-.9046.5464-.4311h1.0321l.759 1.1293-.34 1.1657-1.0625 1.3478-.8804 1.1414-1.2628 1.7-.7893 1.36.0729.1093.1882-.0183 2.8535-.607 1.5421-.2794 1.8396-.3157.8318.3886.091.3946-.3278.8075-1.967.4857-2.3072.4614-3.4364.8136-.0425.0304.0486.0607 1.5482.1457.6618.0364h1.621l3.0175.2247.7892.522.4736.6376-.079.4857-1.2142.6193-1.6393-.3886-3.825-.9107-1.3113-.3279h-.1822v.1093l1.0929 1.0686 2.0035 1.8092 2.5075 2.3314.1275.5768-.3218.4554-.34-.0486-2.2039-1.6575-.85-.7468-1.9246-1.621h-.1275v.17l.4432.6496 2.3436 3.5214.1214 1.0807-.17.3521-.6071.2125-.6679-.1214-1.3721-1.9246L14.38 17.959l-1.1414-1.9428-.1397.079-.674 7.2552-.3156.3703-.7286.2793-.6071-.4614-.3218-.7468.3218-1.4753.3886-1.9246.3157-1.53.2853-1.9004.17-.6314-.0121-.0425-.1397.0182-1.4328 1.9672-2.1796 2.9446-1.7243 1.8456-.4128.164-.7164-.3704.0667-.6618.4008-.5889 2.386-3.0357 1.4389-1.882.929-1.0868-.0062-.1579h-.0546l-6.3385 4.1164-1.1293.1457-.4857-.4554.0608-.7467.2307-.2429 1.9064-1.3114Z"/></svg>', codex: '<svg viewBox="0 0 24 24"><path d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z"/></svg>', pi: '<svg viewBox="0 0 800 800"><path fill="#F09082" d="M165.29 165.29H517.36V400H400V282.65H165.29Z"/><path fill="#4D9ABF" d="M165.29 282.65H282.65V400H400V517.36H282.65V634.72H165.29Z"/><path fill="#F1BE58" d="M517.36 400H634.72V634.72H517.36Z"/></svg>' };
const harnessHtml = (h) => `<span class="hz ${esc(h)}" title="${esc(h)}">${LOGO[h] || esc(h)}</span>`;
// The row's mark: the logo in its own colours, the state dot on its corner.
const markHtml = (r, st) => `<span class="mark ${esc(r.harness)}" title="${esc(r.harness)}">${LOGO[r.harness] || esc(r.harness[0].toUpperCase())}<span class="dot ${st}"></span></span>`;
// The display name: the name, else the cwd's last segment as a chip, else where the session sits; never a pid.
const labelOf = (r) => { const proj = projOf(r), name = r.name || (proj ? '' : r.origin || ''); return `${name ? `<span class="name">${esc(name)}</span>` : ''}${proj ? `<span class="proj">${esc(proj)}</span>` : ''}`; };
const driven = (r) => r.lane === 'headless' || !!r.holder;
// Where a session opens: the conversation view for a driven one, else the node's opener over
// the API (POST /open runs rosterd-open on the machine that has the pane).
function openCommands(r) {
  if (driven(r)) return { link: `/ui/sessions/${r.session_key}`, label: 'conversation' };
  if (r.tmux || r.herdr) return { open: r.session_key, label: r.tmux ? 'tmux' : 'herdr' };
  return {};
}
// ACP option kinds: allow_* are the go, reject_* the no; the gate of R16.2 uses allow, allow_always, deny.
const optClass = (o) => (/allow/.test(o.kind || o.option_id) ? 'go' : /reject|deny/.test(o.kind || o.option_id) ? 'no' : '');
function pendingHtml(key) {
  return (state.pending[key] || []).map((p) => `<div class="pend"><span><b>${esc(p.tool)}</b> <small>${esc(p.summary)} · ${ago(p.at)}</small></span>
    ${p.options.map((o) => `<button class="${optClass(o)}" data-perm="${esc(key)}" data-req='${esc(JSON.stringify(p.request_id))}' data-opt="${esc(o.option_id)}">${esc(o.name)}</button>`).join('')}
    <button data-perm="${esc(key)}" data-req='${esc(JSON.stringify(p.request_id))}'>cancel</button></div>`).join('');
}
function sessionHtml(r) {
  const k = r.session_key, o = openCommands(r), st = stateOf(r), ended = st === 'ended';
  const when = r.activity_at ? ago(r.activity_at) : ago(r.started_at);
  const acts = ended ? '' : [
    o.link ? `<a href="${esc(o.link)}">open ${esc(o.label)}</a>` : '',
    o.open ? `<button data-open="${esc(o.open)}">open ${esc(o.label)}</button>` : '',
    driven(r) ? `<form class="p" data-prompt="${esc(k)}"><input placeholder="prompt" value="${esc(state.drafts[k] || '')}"><button>send</button></form>` : '',
    driven(r) && st === 'active' ? `<button data-cancel="${esc(k)}">cancel turn</button>` : '',
    st === 'suspended' ? `<button data-resume="${esc(k)}">resume</button>` : '',
  ].join('');
  return `<article class="s ${st}" data-key="${esc(k)}">
    ${markHtml(r, st)}
    <div class="who">${labelOf(r)}<span class="state ${st}">${st.replace('_', ' ')}</span>
      <span class="ev">${esc(r.activity_event || '')}${r.activity_event ? ' · ' : ''}${when}${ended && r.ended_reason ? ` · ${esc(r.ended_reason)}` : ''}${r.conflict ? ' · <span class="err">attempt conflict</span>' : ''}</span></div>
    <div class="stats">${statsHtml(r)}</div>
    <div class="acts">${acts}</div>
    <div class="meta">${[r.lane === 'headless' ? 'headless' : '', r.attempt_id ? `attempt ${esc(r.attempt_id)}${r.parent_attempt_id ? ` ← ${esc(r.parent_attempt_id)}` : ''}` : '', r.origin ? esc(r.origin) : '', r.cwd ? esc(tilde(r.cwd)) : ''].filter(Boolean).join(' · ')}</div>
    ${pendingHtml(k)}</article>`;
}
function renderRoster() {
  const sw = state.swarm, live = (sw?.records || []).filter((r) => r.liveness !== 'ended'), need = live.filter((r) => r.activity === 'needs_attention').length;
  $('#hdr').innerHTML = `<b>rosterd</b> <span>${esc((sw?.nodes || []).find((n) => n.state === 'local')?.name || '')}</span>
    <span class="sum">${sw ? plural(live.length, 'session') + (need ? ` · <span class="needs_attention">${need} need${need === 1 ? 's' : ''} attention</span>` : '') : ''}</span>
    <a href="#" id="wsBtn">${ws()?.url ? 'workspace' : 'add workspace'}</a><a href="#" id="qrBtn">pair phone</a><span class="st ${state.status === 'live' ? '' : 'bad'}">${esc(state.status)}</span>`;
  if (!sw) return;
  const byNode = {};
  for (const r of sw.records) (byNode[r.node_id] ||= []).push(r);
  $('#roster').innerHTML = sw.nodes.map((n) => {
    const recs = (byNode[n.node_id] || []).sort((a, b) => RANK[stateOf(a)] - RANK[stateOf(b)] || (b.activity_at || b.started_at).localeCompare(a.activity_at || a.started_at));
    const health = n.revoked ? 'revoked' : n.state === 'local' ? 'this node' : `${n.state}${n.seen_ms == null ? '' : ` ${ms(n.seen_ms)} ago`}${n.uptime_ms == null ? '' : ` · up ${ms(n.uptime_ms)}`}`;
    return `<div class="peer-${n.state}"><h2>${esc(n.name)} <small>${health}${n.capabilities?.harnesses?.length ? ' · ' + n.capabilities.harnesses.map(harnessHtml).join(' ') : ''}</small></h2>
      <div class="list">${recs.map(sessionHtml).join('') || '<small>no sessions</small>'}</div></div>`;
  }).join('');
  // Pending requests of sessions that need attention, refreshed when their claim sequence moves.
  for (const r of sw.records) if (r.activity === 'needs_attention' && state.seen[r.session_key] !== r.activity_seq) {
    state.seen[r.session_key] = r.activity_seq; refreshPending(r.session_key);
  }
}
async function refreshPending(key) {
  try { state.pending[key] = (await api(spath(key))).state?.pending || []; } catch { state.pending[key] = []; }
  renderRoster();
}
async function renderAttention() {
  const w = ws(); const el = $('#attention');
  if (!w?.url) { el.innerHTML = ''; return; }
  const items = state.attention;
  el.innerHTML = `<h2>workspace <small>${esc(w.url)}${state.wsErr ? ` · <span class="err">${esc(state.wsErr)}</span>` : ` · ${items.length} need you`}</small></h2><div class="list">` +
    (items.map((it) => { const d = it.decisionId && state.decisions[it.decisionId];
      return `<article class="s needs_attention"><span class="dot needs_attention"></span><div class="who"><span class="name">${esc(it.taskTitle || it.kind)}</span><span class="state needs_attention">${esc(it.reason)}</span>
        <span class="ev">${it.agent ? esc(it.agent.name) + ' · ' : ''}${ago(it.since)}${it.signalCount > 1 ? ` · ×${it.signalCount}` : ''}</span></div>
        <div class="acts"><a href="${esc(w.url.replace(/\/$/, ''))}/inbox">open in workspace</a>${it.decisionId && !d ? `<button data-decision="${esc(it.decisionId)}">rule</button>` : ''}</div>
        ${d ? `<div class="pend"><span><b>${esc(d.title)}</b> <small>${esc(d.summary)}</small></span>${(d.choices || []).map((c) => `<button data-rule="${esc(d.id)}" data-choice="${esc(c.id)}" title="${esc(c.description || '')}">${esc(c.label)}${c.recommended ? ' ★' : ''}</button>`).join('')}
          ${d.allowFreeText ? `<form class="p" data-rule-text="${esc(d.id)}"><input placeholder="or answer in words"><button>rule</button></form>` : ''}</div>` : ''}
      </article>`; }).join('') || '<small>nothing needs you</small>') + '</div>';
}
async function pollAttention() {
  const w = ws(); if (!w?.url) return;
  try {
    const r = await fetch(`${w.url.replace(/\/$/, '')}/api/v1/me/attention`, { headers: { authorization: `Bearer ${w.token}` } });
    const j = await r.json(); if (!r.ok) throw new Error(j.error?.message || j.error || r.status);
    state.attention = (j.data || j).items || []; state.wsErr = '';
  } catch (e) { state.wsErr = String(e.message || e); }
  renderAttention();
}
async function wsCall(path, body) {
  const w = ws(); const r = await fetch(`${w.url.replace(/\/$/, '')}/api/v1${path}`, { method: body ? 'POST' : 'GET', headers: { authorization: `Bearer ${w.token}`, ...(body ? { 'content-type': 'application/json' } : {}) }, body: body && JSON.stringify(body) });
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error?.message || j.error || r.status); return j.data || j;
}

document.addEventListener('click', async (e) => {
  const b = e.target.closest('button, a'); if (!b) return;
  const d = b.dataset;
  try {
    if (b.id === 'qrBtn') { e.preventDefault(); const p = await api('/pair'); $('#qrSvg').innerHTML = p.svg; $('#qrLink').textContent = p.link; $('#qrLink').href = p.link; $('#qr').showModal(); }
    if (b.id === 'qrCopy') { await navigator.clipboard.writeText($('#qrLink').textContent); b.textContent = 'copied'; }
    else if (b.id === 'wsBtn') { e.preventDefault(); $('#wsUrl').value = ws()?.url || ''; $('#wsTok').value = ws()?.token || ''; $('#ws').showModal(); }
    else if (d.cancel) await api(spath(d.cancel, '/cancel'), {});
    else if (d.resume) await api(spath(d.resume, '/resume'), {});
    else if (d.perm) { await api(spath(d.perm, '/permission'), d.opt ? { request_id: JSON.parse(d.req), outcome: 'selected', option_id: d.opt } : { request_id: JSON.parse(d.req), outcome: 'cancelled' }); await refreshPending(d.perm); }
    else if (d.open) await api(spath(d.open, '/open'), {});
    else if (d.decision) { state.decisions[d.decision] = await wsCall(`/decisions/${d.decision}`); renderAttention(); }
    else if (d.rule) { await wsCall(`/decisions/${d.rule}/rule`, { choiceId: d.choice, surface: 'phone' }); delete state.decisions[d.rule]; pollAttention(); }
  } catch (err) { state.status = String(err.message || err); renderRoster(); }
});
document.addEventListener('submit', async (e) => {
  const f = e.target; if (f.closest('dialog')) return; e.preventDefault();
  const input = f.querySelector('input'); const text = input.value.trim(); if (!text) return;
  try {
    if (f.dataset.prompt) { await api(spath(f.dataset.prompt, '/prompt'), { prompt: text }); state.drafts[f.dataset.prompt] = ''; renderRoster(); }
    else if (f.dataset.ruleText) { await wsCall(`/decisions/${f.dataset.ruleText}/rule`, { text, surface: 'phone' }); delete state.decisions[f.dataset.ruleText]; pollAttention(); }
    else if (f.id === 'sendPrompt') { await api(spath(sessionKey, '/prompt'), { prompt: text }); input.value = ''; }
  } catch (err) { state.status = String(err.message || err); renderRoster(); }
});
document.addEventListener('input', (e) => { const f = e.target.closest('form[data-prompt]'); if (f) state.drafts[f.dataset.prompt] = e.target.value; });
$('#ws').addEventListener('close', () => {
  if ($('#ws').returnValue === 'save') localStorage.setItem('rosterd.workspace', JSON.stringify({ url: $('#wsUrl').value.trim(), token: $('#wsTok').value.trim() }));
  else if ($('#ws').returnValue === 'clear') localStorage.removeItem('rosterd.workspace');
  state.attention = []; renderRoster(); pollAttention();
});

// ---------- session page, /ui/sessions/{key}: the live ACP stream as a plain log plus the last recap ----------
const sessionKey = location.pathname.startsWith('/ui/sessions/') ? decodeURIComponent(location.pathname.slice('/ui/sessions/'.length)) : '';
function logLine(msg) {
  const u = msg.params?.update || msg.update || msg, log = $('#log');
  const kind = u.sessionUpdate || u.session_update || msg.method || '';
  let text = '';
  if (kind === 'agent_message_chunk' || kind === 'agent_thought_chunk') text = u.content?.text ?? u.content ?? '';
  else if (kind === 'tool_call') text = `\n▸ ${u.title || u.toolCallId || 'tool'}${u.kind ? ` (${u.kind})` : ''}\n`;
  else if (kind === 'tool_call_update') text = u.status ? `  ${u.title || u.toolCallId || 'tool'}: ${u.status}\n` : '';
  else if (kind === 'user_message_chunk') text = `\n> ${u.content?.text ?? ''}\n`;
  else if (msg.method === 'session/request_permission') text = `\n? permission: ${msg.params?.toolCall?.title || ''}\n`;
  else return;
  const span = document.createElement('span'); if (kind.startsWith('tool') || kind === 'agent_thought_chunk') span.className = 'tool';
  span.textContent = typeof text === 'string' ? text : JSON.stringify(text); log.append(span);
  if (log.childElementCount > 4000) log.firstChild.remove();
  window.scrollTo(0, document.body.scrollHeight);
}
async function sessionPage() {
  $('#roster').hidden = true; $('#log').hidden = false; $('#recap').hidden = false;
  state.local = nodeOf(sessionKey); // the key's node id: a peer's session goes through /swarm/{node_id}/, a local one directly.
  try { const nodes = await api('/swarm/nodes'); state.local = (nodes.nodes || nodes).find((n) => n.state === 'local')?.node_id || state.local; } catch {}
  let last = null;
  const head = () => { const st = last ? stateOf(last) : 'unknown';
    $('#hdr').innerHTML = `<a href="/ui">← roster</a> <b>${last ? labelOf(last) : esc(sessionKey)}</b> <span class="state ${st}">${st.replace('_', ' ')}</span><span class="stats">${last ? statsHtml(last) : ''}</span><span class="st ${state.status === 'live' ? '' : 'bad'}">${esc(state.status)}</span>`;
    $('#recap').innerHTML = (last?.state?.last_recap ? `last recap: ${esc(last.state.last_recap)}` : '') + pendingHtml(sessionKey); };
  const refresh = async () => { try { last = await api(spath(sessionKey)); state.pending[sessionKey] = last.state?.pending || []; } catch (e) { state.status = e.message; } head(); };
  await refresh(); setInterval(refresh, 10000);
  $('#recap').insertAdjacentHTML('afterend', `<form class="p" id="sendPrompt" style="padding:10px 16px"><input placeholder="prompt" style="flex:1;width:auto"><button>send</button></form>`);
  sse(spath(sessionKey, '/stream'), logLine, (s) => { state.status = s || 'live'; head(); });
}

if (sessionKey) sessionPage();
else {
  renderRoster(); pollAttention(); setInterval(pollAttention, 15000); setInterval(renderRoster, 30000);
  sse('/swarm/events', (snap) => { state.swarm = snap; state.local = (snap.nodes || []).find((n) => n.state === 'local')?.node_id || state.local; renderRoster(); },
    (s) => { state.status = s || 'live'; renderRoster(); });
}
</script>
